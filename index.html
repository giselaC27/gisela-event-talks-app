<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Talks Today</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 1rem;
    }

    .search-container {
      text-align: center;
      margin-bottom: 1rem;
    }

    #search {
      width: 50%;
      padding: 0.5rem;
    }

    .schedule-container {
      display: grid;
      grid-gap: 1rem;
    }

    .talk {
      background-color: #fff;
      padding: 1rem;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .talk h2 {
      margin-top: 0;
    }

    .talk .time {
      font-weight: bold;
    }

    .talk .speakers {
      font-style: italic;
    }

    .talk .category {
      margin-top: 0.5rem;
    }

    .talk .category span {
      background-color: #333;
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      margin-right: 0.5rem;
    }

    footer {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 1rem;
      position: sticky;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tech Talks Today</h1>
  </header>
  <main>
    <div class="search-container">
      <input type="text" id="search" placeholder="Search by category...">
    </div>
    <div id="schedule" class="schedule-container"></div>
  </main>
  <footer>
    <p>&copy; 2025 Tech Talks Today</p>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const scheduleContainer = document.getElementById('schedule');
      const searchInput = document.getElementById('search');
      const talks = [
        {
          "title": "The Future of JavaScript",
          "speakers": ["John Doe"],
          "category": ["JavaScript", "Web Development", "Future"],
          "duration": 60,
          "description": "A deep dive into the upcoming features of JavaScript and how they will shape the future of web development."
        },
        {
          "title": "CSS Grid and Flexbox: A Love Story",
          "speakers": ["Jane Smith"],
          "category": ["CSS", "Web Design"],
          "duration": 60,
          "description": "Learn how to create complex and responsive layouts with ease using CSS Grid and Flexbox."
        },
        {
          "title": "Building Scalable APIs with Node.js",
          "speakers": ["Peter Jones", "Mary Johnson"],
          "category": ["Node.js", "API", "Backend"],
          "duration": 60,
          "description": "A comprehensive guide to building scalable and maintainable APIs with Node.js and Express."
        },
        {
          "title": "Introduction to Machine Learning",
          "speakers": ["David Williams"],
          "category": ["Machine Learning", "AI"],
          "duration": 60,
          "description": "A beginner-friendly introduction to the world of machine learning and its applications."
        },
        {
          "title": "The Power of Serverless",
          "speakers": ["Susan Brown"],
          "category": ["Serverless", "Cloud", "Architecture"],
          "duration": 60,
          "description": "Discover the benefits of serverless architecture and how it can help you build and deploy applications faster."
        },
        {
          "title": "Cybersecurity in the Modern Age",
          "speakers": ["Michael Miller"],
          "category": ["Cybersecurity", "Security"],
          "duration": 60,
          "description": "An overview of the latest cybersecurity threats and how to protect yourself and your organization."
        }
      ];

      displayTalks(talks);

      function displayTalks(talksToDisplay) {
        scheduleContainer.innerHTML = '';
        let currentTime = new Date('2025-10-29T10:00:00');

        talksToDisplay.forEach((talk, index) => {
          const talkElement = document.createElement('div');
          talkElement.classList.add('talk');

          const startTime = new Date(currentTime);
          const endTime = new Date(currentTime.getTime() + talk.duration * 60000);

          talkElement.innerHTML = `
            <div class="time">${formatTime(startTime)} - ${formatTime(endTime)}</div>
            <h2>${talk.title}</h2>
            <div class="speakers">By: ${talk.speakers.join(', ')}</div>
            <div class="category">${talk.category.map(c => `<span>${c}</span>`).join(' ')}</div>
            <p>${talk.description}</p>
          `;

          scheduleContainer.appendChild(talkElement);

          currentTime = new Date(endTime.getTime() + 10 * 60000);

          if (index === 2) {
            const lunchBreakElement = document.createElement('div');
            lunchBreakElement.classList.add('talk');
            const lunchStartTime = new Date(currentTime);
            const lunchEndTime = new Date(currentTime.getTime() + 60 * 60000);
            lunchBreakElement.innerHTML = `
            <div class="time">${formatTime(lunchStartTime)} - ${formatTime(lunchEndTime)}</div>
            <h2>Lunch Break</h2>
            `;
            scheduleContainer.appendChild(lunchBreakElement);
            currentTime = lunchEndTime;
          }
        });
      }

      function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      searchInput.addEventListener('input', e => {
        const searchTerm = e.target.value.toLowerCase();
        const filteredTalks = talks.filter(talk => {
          return talk.category.some(c => c.toLowerCase().includes(searchTerm));
        });
        displayTalks(filteredTalks);
      });
    });
  </script>
</body>
</html>
